name: Folder format debug

on:
  push:
    branches:
      - agent/folder-browsing-282

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4
          cache: true
      - name: Print exact Dart formatter diff
        run: |
          dart format \
            lib/core/sources/jellyfin/jellyfin_folder_browser_source.dart \
            lib/core/sources/subsonic/subsonic_folder_browser_source.dart \
            lib/features/library/folder_browser_providers.dart
          git diff --no-ext-diff --unified=200 -- \
            lib/core/sources/jellyfin/jellyfin_folder_browser_source.dart \
            lib/core/sources/subsonic/subsonic_folder_browser_source.dart \
            lib/features/library/folder_browser_providers.dart
