name: Onboarding format preview

on:
  pull_request:
    paths:
      - 'lib/features/onboarding/onboarding_screen.dart'
      - '.github/workflows/onboarding-format-preview.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.2.0-onboarding
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4
          cache: true
      - name: Apply dart format
        run: dart format lib/features/onboarding/onboarding_screen.dart
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- lib/features/onboarding/onboarding_screen.dart; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/onboarding/onboarding_screen.dart
          git commit -m "style(onboarding): apply dart format"
          git push origin HEAD:feature/v0.2.0-onboarding
