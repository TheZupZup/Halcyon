name: CI

# Quality, security, and release-hygiene checks on every PR and on pushes to
# main. Three independent jobs run in parallel:
#   * flutter             — format, analyze, test, lockfile-enforced pub get.
#   * secret-scan         — offline scan for committed secrets / private data.
#   * release-bump-guard  — release/* PRs only: the bump must be version-only.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    # Temporary write access only for the toolchain migration run below. This is
    # removed again once the regenerated lockfile is committed to the PR branch.
    permissions:
      contents: write
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: chore/flutter-3.44.7

      # Pinned to the current Flutter 3.44.x stable line (Dart 3.12.x) for
      # reproducible runs. Keep this in sync with .flutter-version and the SDK
      # constraint in pubspec.yaml; bumping it may require reformatting with the
      # newer `dart format`.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      # One-time migration: Flutter-owned SDK packages change with the Flutter
      # version, so regenerate the committed lockfile using exactly 3.44.7.
      - name: Refresh dependencies for toolchain migration
        run: flutter pub get

      - name: Commit refreshed lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore: refresh lockfile for Flutter 3.44.7"
          git push origin HEAD:chore/flutter-3.44.7

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  secret-scan:
    name: Secret & privacy scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pure bash + git: no Flutter, no network, no secrets. Catches an
      # accidentally committed keystore / .env / private key / token and a
      # diagnostics fixture carrying a real URL or home path. Local twin:
      # `./scripts/check_secrets.sh` (also wired into scripts/verify_android.sh).
      - name: Scan for secrets and private data
        run: ./scripts/check_secrets.sh

  release-bump-guard:
    name: Release bump touches only version files
    runs-on: ubuntu-latest
    # Only meaningful for the version-bump PRs the "Prepare release bump"
    # workflow opens (it pushes a release/v<version> branch). github.head_ref is
    # set only for pull_request events, so this naturally skips pushes to main
    # and every non-release PR.
    if: ${{ startsWith(github.head_ref, 'release/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Diff the PR against its base and assert the changed files stay within the
      # version-bump allowlist (pubspec, app_info, Fastlane changelog, F-Droid
      # metadata, …). Local twin: scripts/check_release_bump_files.sh.
      - name: Check changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD \
            | ./scripts/check_release_bump_files.sh
