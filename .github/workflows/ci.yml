name: CI

# Quality, security, and release-hygiene checks on every PR and on pushes to
# main. Four independent jobs run in parallel:
#   * flutter             — format, analyze, test, lockfile-enforced pub get.
#   * secret-scan         — offline scan for committed secrets / private data.
#   * release-bump-guard  — release/* PRs only: the bump must be version-only.
#   * dependency-guard    — deps/* PRs only: the update must be lockfile-only.
#   * toolchain-guard     — toolchain/flutter-sdk only: the bump must be
#                           pin-only.
#   * android-toolchain-guard — the three automatic Gradle/AGP/Kotlin branches
#                           only: the bump must be one version string.
on:
  push:
    branches: [main]
  pull_request:

# Read-only: every job here only inspects the checkout. No secrets are used, so
# these checks run identically on fork PRs.
permissions:
  contents: read

jobs:
  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Installs the version pinned in .flutter-version (the single source of
      # truth, also read by scripts/setup_flutter.sh). Bumping it may require
      # reformatting with the newer Dart and a matching SDK constraint in
      # pubspec.yaml.
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      # --enforce-lockfile makes `pub get` FAIL instead of silently rewriting
      # pubspec.lock when it has drifted from pubspec.yaml. This is the same
      # resolution the reproducible F-Droid build depends on — the lockfile is
      # committed for exactly this reason (docs/release-process.md §7) — so a PR
      # that changes a dependency without refreshing the lockfile is caught here
      # instead of at release time.
      - name: Install dependencies (lockfile-enforced)
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  secret-scan:
    name: Secret & privacy scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pure bash + git: no Flutter, no network, no secrets. Catches an
      # accidentally committed keystore / .env / private key / token and a
      # diagnostics fixture carrying a real URL or home path. Local twin:
      # `./scripts/check_secrets.sh` (also wired into scripts/verify_android.sh).
      - name: Scan for secrets and private data
        run: ./scripts/check_secrets.sh

  release-bump-guard:
    name: Release bump touches only version files
    runs-on: ubuntu-latest
    # Only meaningful for the version-bump PRs the "Prepare release bump"
    # workflow opens (it pushes a release/v<version> branch). github.head_ref is
    # set only for pull_request events, so this naturally skips pushes to main
    # and every non-release PR.
    if: ${{ startsWith(github.head_ref, 'release/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Diff the PR against its base and assert the changed files stay within the
      # version-bump allowlist (pubspec, app_info, Fastlane changelog, F-Droid
      # metadata, …). Local twin: scripts/check_release_bump_files.sh.
      - name: Check changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD \
            | ./scripts/check_release_bump_files.sh

  dependency-guard:
    name: Dependency update touches only the lockfile
    runs-on: ubuntu-latest
    # Only meaningful for the PRs the "Dart dependency updates" workflow opens
    # (it pushes the deps/dart-packages branch). The updater already refuses to
    # commit anything but pubspec.lock; re-checking here covers what happens to
    # the branch afterwards — a well-meaning "just fix the test" commit pushed
    # onto the update PR is exactly the change that must not ride along.
    if: ${{ startsWith(github.head_ref, 'deps/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Local twin: scripts/check_dependency_update_files.sh. --kind defaults to
      # dart-packages, whose allowlist is pubspec.lock and nothing else.
      - name: Check changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD \
            | ./scripts/check_dependency_update_files.sh --kind dart-packages

  toolchain-guard:
    name: Toolchain update touches only the pin
    runs-on: ubuntu-latest
    # Only the one branch the "Flutter SDK updates" workflow pushes. The
    # updater already refuses to commit anything but .flutter-version;
    # re-checking here covers what happens to the branch afterwards — an "I'll
    # just migrate the deprecated API while I'm here" commit pushed onto the
    # SDK PR is exactly the change that must not ride along, because that
    # migration is a human's separate PR. Matched exactly, not by prefix: a
    # human's toolchain/* PR is an ordinary PR and must not inherit the
    # pin-only rule.
    if: ${{ github.head_ref == 'toolchain/flutter-sdk' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same script as the dependency guard, with the SDK updater's narrower
      # allowlist: .flutter-version, and nothing else — not even pubspec.lock,
      # which only a human may re-resolve.
      - name: Check changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD \
            | ./scripts/check_dependency_update_files.sh --kind flutter-sdk

  android-toolchain-guard:
    name: Android toolchain update touches only its own pin
    runs-on: ubuntu-latest
    # Only the three branches the "Android toolchain updates" workflow pushes,
    # each matched exactly. A broad `toolchain/*` rule would be wrong twice
    # over: it would hold every future human toolchain PR to the pin-only rule,
    # and it could not tell which of the three pins the PR is allowed to move.
    if: >-
      ${{ github.head_ref == 'toolchain/gradle'
      || github.head_ref == 'toolchain/agp'
      || github.head_ref == 'toolchain/kotlin' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Two guards, the same two the updater ran before committing — but here
      # against the real PR diff, so anything pushed onto the branch afterwards
      # is caught too.
      #
      # The second one is the interesting half. AGP and Kotlin are pinned in
      # the *same file*, so "only android/settings.gradle changed" says nothing
      # about which of the two moved. check_toolchain_pin_diff.py answers that
      # by putting the old version back into the new file and requiring the
      # result to be byte-identical to the old one: a Kotlin edit riding along
      # in an AGP PR, or a reworded comment, cannot survive that.
      - name: Check changed files and their contents
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          kind="${HEAD_REF#toolchain/}"
          git diff --name-only "$BASE_SHA" HEAD \
            | ./scripts/check_dependency_update_files.sh --kind "$kind"
          python3 scripts/check_toolchain_pin_diff.py \
            --kind "$kind" --base "$BASE_SHA" --head HEAD
