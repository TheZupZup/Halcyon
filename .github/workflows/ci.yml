name: CI

# Quality, security, and release-hygiene checks on every PR and on pushes to
# main. Three independent jobs run in parallel:
#   * flutter             — format, analyze, test, lockfile-enforced pub get.
#   * secret-scan         — offline scan for committed secrets / private data.
#   * release-bump-guard  — release/* PRs only: the bump must be version-only.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: chore/flutter-3.44.7

      - name: Sync remaining Flutter pins
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('.github/workflows/flutter-ci-fixer.yml'): [
                  ('3.27.4', '3.44.7'),
              ],
              Path('.github/workflows/android-release-build.yml'): [
                  ('3.27.4', '3.44.7'),
              ],
              Path('docs/development.md'): [
                  ('3.27.4', '3.44.7'),
                  ('3.27.x', '3.44.x'),
              ],
              Path('docs/release-process.md'): [
                  ('pinned Flutter `3.27.4`', 'pinned Flutter `3.44.7`'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text == original:
                  print(f'No change needed: {path}')
              else:
                  path.write_text(text)
                  print(f'Updated: {path}')
          PY

          if git diff --quiet; then
            echo "All remaining pins are already current."
            exit 0
          fi

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/flutter-ci-fixer.yml \
                  .github/workflows/android-release-build.yml \
                  docs/development.md \
                  docs/release-process.md
          git commit -m "chore: sync Flutter 3.44.7 toolchain pins"
          git push origin HEAD:chore/flutter-3.44.7

      # Pinned to the current Flutter 3.44.x stable line for reproducible runs.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Install dependencies (lockfile-enforced)
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  secret-scan:
    name: Secret & privacy scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for secrets and private data
        run: ./scripts/check_secrets.sh

  release-bump-guard:
    name: Release bump touches only version files
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.head_ref, 'release/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD \
            | ./scripts/check_release_bump_files.sh
